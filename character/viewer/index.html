<meta charset="utf-8">
<title>Knight Turntable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Alegreya+Sans:wght@400;500&display=swap">
<style>
  /* Layout: one full-height stage; a slim spec rail sits over it on wide screens and below it on phones. */
  :root {
    --bg: #1d2024;          /* studio backdrop, slightly blue-steel */
    --stage: #2a2e33;
    --fg: #e4e1da;
    --muted: #9a9e9f;
    --line: #3b4046;
    --accent: #b88a52;      /* worn leather */
    --display: "Alegreya Sans SC", "Trebuchet MS", sans-serif;
    --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  .wrap { position: relative; height: 100%; display: grid; grid-template-rows: 1fr; }
  #stage { position: relative; min-height: 60vh; background: radial-gradient(ellipse at 50% 35%, var(--stage), var(--bg) 75%); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--display); letter-spacing: .08em; pointer-events: none; }
  .rail { position: absolute; top: 16px; left: 16px; width: min(300px, calc(100% - 32px)); display: grid; gap: 14px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .04em; line-height: 1.1; text-wrap: balance; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .views { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: 500 13px var(--display); letter-spacing: .08em; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
  dt { color: var(--muted); font-family: var(--display); letter-spacing: .06em; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .hint { position: absolute; right: 16px; bottom: 14px; color: var(--muted); font-size: 12px; }
  @media (max-width: 640px) {
    .wrap { height: auto; }
    #stage { height: 70vh; }
    .rail { position: static; width: auto; padding: 16px; }
  }
</style>

<div class="wrap">
  <div id="stage">
    <div class="status" id="status">Loading model…</div>
    <div class="hint">Drag to orbit · scroll to zoom</div>
  </div>
  <div class="rail">
    <div>
      <h1>Wandering Knight</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="views" role="group" aria-label="Model">
      <button data-model="ai" aria-pressed="true">AI scan</button>
      <button data-model="proc" aria-pressed="false">Procedural</button>
    </div>
    <div class="views" role="group" aria-label="Camera view">
      <button id="v-front" data-view="front" aria-pressed="true">Front</button>
      <button id="v-back" data-view="back">Back</button>
      <button id="v-side" data-view="side">Side</button>
      <button id="v-face" data-view="face">Face</button>
      <button id="v-spin" aria-pressed="false">Turntable</button>
    </div>
    <dl id="specs"></dl>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const stage = document.getElementById("stage");
const status = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 0.6;
controls.maxDistance = 9;
controls.target.set(0, 0.95, 0);

const key = new THREE.DirectionalLight(0xfff1e0, 2.2);
key.position.set(-2, 3.5, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 2.2, bottom: -0.2 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe0ff, 1.4);
rim.position.set(1, 3, -3);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x2a2420, 0.6));

const floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 64), new THREE.MeshStandardMaterial({ color: 0x1c1f23, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const VIEWS = {
  front: { pos: [0, 1.15, 5.2], target: [0, 0.92, 0] },
  back:  { pos: [0, 1.15, -5.2], target: [0, 0.92, 0] },
  side:  { pos: [-5.2, 1.15, 0], target: [0, 0.92, 0] },
  face:  { pos: [-0.35, 1.70, 1.25], target: [0, 1.66, 0] },
};
let tween = null;
function goTo(name) {
  const v = VIEWS[name];
  tween = { t: 0, fromP: camera.position.clone(), toP: new THREE.Vector3(...v.pos),
            fromT: controls.target.clone(), toT: new THREE.Vector3(...v.target) };
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
}
camera.position.set(...VIEWS.front.pos);
controls.target.set(...VIEWS.front.target);

document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => goTo(b.dataset.view)));
const spinBtn = document.getElementById("v-spin");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
spinBtn.addEventListener("click", () => {
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 1.6;
  spinBtn.setAttribute("aria-pressed", String(controls.autoRotate));
});

const MODELS = {
  ai: {
    file: "knight_ai.gltf.json",
    sub: "Image-to-3D scan of the front reference (TRELLIS.2); the front, face and eyes are projected from the photo.",
    specs: [["Height", "1.80 m"], ["Triangles", "236,904"], ["Parts", "1 mesh, 1 PBR material"],
            ["Textures", "4096² base colour + metal/rough, JPEG"], ["Source", "ai/front.png via ai/generate.py, ai/finalize.py"],
            ["File", "ai/knight_ai.glb"]],
  },
  proc: {
    file: "knight.gltf.json",
    sub: "Procedural model built from the front, back and side reference sheet.",
    specs: [["Height", "1.80 m"], ["Triangles", "169,480"], ["Parts", "264 meshes, 19 materials"],
            ["Armour", "3 steel chest lames, 4-lame pauldrons, mail sleeves"],
            ["Arms", "Longsword, scabbard, heater shield with eagle"], ["File", "knight.glb, PBR textures embedded"]],
  },
};
// The artifact sandbox refuses fetch() of data: URIs and loading images from blob: URLs, which is
// how GLTFLoader reads an embedded .gltf. So the page fetches the JSON itself, decodes the base64
// buffer into an in-memory GLB, and decodes textures straight from their bytes.
function base64ToBytes(b64) {
  if (Uint8Array.fromBase64) return Uint8Array.fromBase64(b64);
  const s = atob(b64), out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function fetchText(file, onProgress) {
  const res = await fetch(file);
  if (!res.ok) throw new Error(`${file}: HTTP ${res.status}`);
  const total = Number(res.headers.get("content-length")) || 0;
  if (!res.body || !total) return res.text();
  const reader = res.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value);
    got += value.length;
    onProgress(Math.min(got / total, 1));
  }
  const buf = new Uint8Array(got);
  let o = 0;
  for (const part of parts) { buf.set(part, o); o += part.length; }
  return new TextDecoder().decode(buf);
}
async function embeddedGltfToGlb(file, onProgress) {
  const json = JSON.parse(await fetchText(file, onProgress));
  const uri = json.buffers[0].uri;
  const bin = base64ToBytes(uri.slice(uri.indexOf(",") + 1));
  delete json.buffers[0].uri;
  const head = new TextEncoder().encode(JSON.stringify(json));
  const jlen = (head.length + 3) & ~3, blen = (bin.length + 3) & ~3;
  const glb = new Uint8Array(28 + jlen + blen);
  const dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546c67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, jlen, true); dv.setUint32(16, 0x4e4f534a, true);
  glb.set(head, 20); glb.fill(0x20, 20 + head.length, 20 + jlen);
  dv.setUint32(20 + jlen, blen, true); dv.setUint32(24 + jlen, 0x004e4942, true);
  glb.set(bin, 28 + jlen);
  return glb.buffer;
}
const loader = new GLTFLoader();
if (typeof createImageBitmap === "function") {
  loader.register(parser => {
    const bitmaps = {};
    parser.loadImageSource = function (index) {
      if (!bitmaps[index]) {
        const def = parser.json.images[index];
        bitmaps[index] = parser.getDependency("bufferView", def.bufferView)
          .then(view => createImageBitmap(new Blob([view], { type: def.mimeType }), { premultiplyAlpha: "none", colorSpaceConversion: "none" }))
          .then(bitmap => {
            const t = new THREE.Texture(bitmap);
            t.needsUpdate = true;
            t.userData.mimeType = def.mimeType;
            return t;
          });
        return bitmaps[index];
      }
      return bitmaps[index].then(t => t.clone());
    };
    return { name: "inline_image_bitmaps" };
  });
}

const loaded = {}, loading = {};
let current = null;
function showModel(name) {
  const m = MODELS[name];
  current = name;
  document.querySelectorAll("[data-model]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.model === name)));
  document.getElementById("sub").textContent = m.sub;
  const dl = document.getElementById("specs");
  dl.replaceChildren(...m.specs.flatMap(([k, v]) => {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k; dd.textContent = v;
    return [dt, dd];
  }));
  for (const [k, obj] of Object.entries(loaded)) obj.visible = k === name;
  if (loaded[name]) { status.hidden = true; return; }
  status.hidden = false;
  status.textContent = "Loading model…";
  if (loading[name]) return;
  loading[name] = embeddedGltfToGlb(m.file, f => {
    if (current === name) status.textContent = `Loading model… ${Math.round(f * 100)}%`;
  })
    .then(glb => {
      if (current === name) status.textContent = "Preparing model…";
      return loader.parseAsync(glb, "");
    })
    .then(gltf => {
      const model = gltf.scene;
      const aniso = renderer.capabilities.getMaxAnisotropy();
      model.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        for (const k of ["map", "metalnessMap", "roughnessMap", "normalMap"]) if (o.material[k]) o.material[k].anisotropy = aniso;
      });
      loaded[name] = model;
      model.visible = current === name;
      scene.add(model);
      if (current === name) status.hidden = true;
    })
    .catch(err => {
      delete loading[name];
      if (current === name) status.textContent = `The model could not be loaded (${err?.message || err}). Reload the page or switch to the other model.`;
      console.error(err);
    });
}
document.querySelectorAll("[data-model]").forEach(b => b.addEventListener("click", () => showModel(b.dataset.model)));
showModel("ai");

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (tween) {
    tween.t = reduce ? 1 : Math.min(1, tween.t + dt * 1.6);
    const k = 1 - Math.pow(1 - tween.t, 3);
    camera.position.lerpVectors(tween.fromP, tween.toP, k);
    controls.target.lerpVectors(tween.fromT, tween.toT, k);
    if (tween.t >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
