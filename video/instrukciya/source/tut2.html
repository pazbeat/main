<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Imbir tutorial</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>
:root{--gold:#b69244;--gold-hi:#ecc978;--plum:#2b0b3d;--serif:"Cormorant Garamond",serif;--sans:"Montserrat",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000}
#stage{position:relative;overflow:hidden;font-family:var(--sans);color:#fff;background:radial-gradient(1200px 900px at 50% 30%,#3a1250 0%,#1c0726 60%,#0b0210 100%)}

.abs{position:absolute}
.layer{position:absolute;inset:0}

#bar{position:absolute;left:0;top:0;right:0;height:56px;background:#f3edf6;display:flex;align-items:center;padding:0 22px;gap:10px;z-index:3;border-bottom:1px solid #e3d8ea}
#bar .dot{width:14px;height:14px;border-radius:50%}
#url{margin-left:26px;width:640px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;gap:10px;padding-left:16px;font-size:17px;color:#6f6477}
#url b{color:#2b1734;font-weight:600}
#screen{position:absolute;overflow:hidden;background:#fff}
.pc #screen{left:0;top:56px;width:1920px;height:1024px}
.mob #phone{position:absolute;left:182px;top:372px;width:716px;height:1508px;border-radius:84px;background:#0d0310;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px rgba(217,188,121,.45)}
.mob #screen{left:199px;top:388px;width:682px;height:1476px;border-radius:68px}
#inner{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#inner img{position:absolute;left:0;top:0;width:100%;height:100%}
#cursor{position:absolute;left:0;top:0;width:30px;height:40px;transform-origin:0 0;z-index:5;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.ripple{position:absolute;border-radius:50%;border:3px solid #d9a93c;background:rgba(236,201,120,.25);z-index:4;pointer-events:none}
.finger{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(182,146,68,.9);z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.ring{position:absolute;border:4px solid #d9a93c;border-radius:14px;z-index:4;box-shadow:0 0 0 6px rgba(236,201,120,.25)}
#badge{position:absolute;z-index:6;white-space:nowrap;display:flex;align-items:center;gap:14px;background:#2b0b3d;color:#fff;border-radius:999px;padding:10px 24px 10px 12px;font-weight:600;letter-spacing:.02em;box-shadow:0 10px 30px rgba(43,11,61,.35)}
#badge .n{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e4c47c,#b69244);color:#2b0b3d;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;font-weight:700}
.pc #badge{right:24px;top:8px;font-size:18px;padding:6px 22px 6px 8px}
.pc #badge .n{width:32px;height:32px;font-size:22px}
.mob #badge{left:50%;top:74px;transform:translateX(-50%);font-size:28px;padding:12px 32px 12px 12px}
.mob #badge .n{width:48px;height:48px;font-size:32px}
/* ---------- subtitles ---------- */
#sub{position:absolute;z-index:8;text-align:center;display:flex;justify-content:center;pointer-events:none}
#sub span{display:inline-block;background:rgba(20,5,28,.86);color:#fff;border-radius:18px;font-weight:500;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pc #sub{left:220px;right:220px;bottom:34px}
.pc #sub span{font-size:31px;padding:14px 30px;max-width:1480px}
.mob #sub{left:50px;right:50px;top:152px;height:200px;align-items:center}
.mob #sub span{font-size:36px;padding:18px 30px}
/* ---------- graphic scenes ---------- */
.g{position:absolute;inset:0;display:none;background:radial-gradient(1200px 900px at 50% 30%,#3a1250 0%,#1c0726 60%,#0b0210 100%)}
.eyebrow{font-weight:500;letter-spacing:.38em;text-transform:uppercase;color:var(--gold-hi)}
.h{font-family:var(--serif);font-weight:500;line-height:1.02}
.h i{font-style:italic;color:var(--gold-hi);font-weight:400}
.logo{position:absolute}
.card{position:absolute;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.term{position:absolute;display:flex;align-items:center;gap:26px;transition:none}
.term .ic{flex:none;border-radius:50%;border:2px solid rgba(236,201,120,.6);display:flex;align-items:center;justify-content:center;background:rgba(236,201,120,.08)}
.term .ic svg{stroke:#ecc978;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.term .tx{font-weight:500;line-height:1.3}
.term .tx small{display:block;font-weight:400;color:rgba(255,255,255,.65);margin-top:6px}
.pc .term{left:170px;width:1580px}
.pc .term .ic{width:78px;height:78px} .pc .term .ic svg{width:38px;height:38px}
.pc .term .tx{font-size:36px} .pc .term .tx small{font-size:24px}
.mob .term{left:80px;width:920px}
.mob .term .ic{width:96px;height:96px} .mob .term .ic svg{width:46px;height:46px}
.mob .term .tx{font-size:40px} .mob .term .tx small{font-size:28px}
.pill{display:inline-block;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:999px;background:linear-gradient(135deg,#e4c47c,#b69244);color:#2b0b3d}
#dip{position:absolute;inset:0;background:#0b0210;z-index:20;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <!-- screen layer -->
  <div class="layer" id="Lscreen">
    <div id="bar"><span class="dot" style="background:#e7a6a6"></span><span class="dot" style="background:#ecd39a"></span><span class="dot" style="background:#b9ddb9"></span>
      <div id="url"><svg width="14" height="16" viewBox="0 0 14 16"><rect x="1" y="7" width="12" height="8" rx="2" fill="#8a8091"/><path d="M4 7V5a3 3 0 0 1 6 0v2" stroke="#8a8091" stroke-width="2" fill="none"/></svg><span id="urltx"><b>imbir.kz</b>/ru</span></div></div>

</div>

<script>
const Q = new URLSearchParams(location.search); const DEV = Q.get('dev') || 'pc'; const PC = DEV === 'pc'; const LANG = Q.get('lang') || 'ru';
const TXT = {

    inE: 'Видеоинструкция', inH: 'Как купить<br><i>подарочный сертификат</i>', inC: `на сайте imbir.kz · ${PC ? 'с компьютера' : 'с телефона'}`,
    afE: 'После оплаты', afH: 'Сертификат<br><i>придёт на почту</i>', mail1: 'Входящие · сейчас', mail2: 'Вам подарок — сертификат Imbir Thai Spa', mail3: 'PDF с QR‑кодом · действует 3 месяца',
    check: 'imbir.kz → «Проверить» — статус и баланс сертификата', tmH: 'Важные <i>условия</i>',

    terms: [['Действует 3 месяца с даты покупки', 'дата окончания указана на сертификате'], ['Во всех салонах сети «Имбирь»', 'кроме салона Imbir Platinum'],

      ['Покажите сертификат администратору', 'на экране телефона или распечатанным'], ['Дороже номинала — доплата на месте', 'дешевле — остаток останется на балансе'],

      ['Cancel at least 3 hours in advance', 'otherwise the service is written off'], ['The certificate cannot be exchanged for cash', '']]},
  kk: {steps: {1: 'Дизайн', 2: 'Сыйлық', 3: PC ? 'Арнау жазуы' : 'Кімге', 4: PC ? 'Филиал' : 'Салон', 5: 'Жіберу', 6: 'Төлем'}, badge: (n, s) => `${n}-қадам, барлығы 6 · ${s}`,
    inE: 'Бейненұсқаулық', inH: 'Сыйлық сертификатын<br><i>қалай сатып алуға болады</i>', inC: `imbir.kz сайтында · ${PC ? 'компьютерден' : 'телефоннан'}`,
    afE: 'Төлемнен кейін', afH: 'Сертификат<br><i>поштаға келеді</i>', mail1: 'Кіріс · қазір', mail2: 'Сізге сыйлық — Imbir Thai Spa сертификаты', mail3: 'QR‑коды бар PDF · 3 ай жарамды',
    check: 'imbir.kz/kk/check — сертификаттың күйі мен балансы', tmH: 'Маңызды <i>шарттар</i>',

      ['Алдын ала жазылыңыз — телефонмен немесе WhatsApp арқылы', 'барлық салон нөмірлері: imbir.kz → «Салондар»'], ['Басталардан 10–15 минут бұрын келіңіз', ''],
      ['Сертификатты әкімшіге көрсетіңіз', 'телефон экранында немесе басып шығарып'], ['Бағдарлама қымбат болса — айырмасын төлейсіз', 'арзан болса — қалдығы балансқа сақталады'],

};
const X = TXT[LANG]; document.documentElement.lang = LANG; const SFX = LANG === 'ru' ? '' : '_' + LANG;
document.documentElement.className = DEV;
if (!PC) { document.getElementById('bar').style.display = 'none'; } else { document.getElementById('phone').style.display = 'none'; }
const $ = id => document.getElementById(id);
const cl = x => Math.max(0, Math.min(1, x)); const L = (a, b, k) => a + (b - a) * k;
const E = {out: t => 1 - Math.pow(1 - t, 3), out5: t => 1 - Math.pow(1 - t, 5), io: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2};
const P = (t, a, b, e = E.out) => e(cl((t - a) / (b - a)));
function rv(el, t, a, {d = .7, dy = 30, dx = 0, blur = 10, z = 1e9} = {}) { const i = P(t, a, a + d, E.out5), o = 1 - P(t, z - .4, z, E.io);
  el.style.opacity = (i * o).toFixed(3); el.style.transform = `translate(${((1 - i) * dx).toFixed(1)}px,${((1 - i) * dy).toFixed(1)}px)`; const b = (1 - i) * blur + (1 - o) * 8; el.style.filter = b > .1 ? `blur(${b.toFixed(1)}px)` : 'none'; }

  pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  show: '<svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><rect x="9" y="6" width="6" height="6"/><path d="M9 16h6"/></svg>',
  wallet: '<svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-4v4"/><circle cx="16.5" cy="13.5" r="1.2"/></svg>',

  const G = (id, html) => { $(id).innerHTML = html; };

        <img id="in-shot" style="width:100%;display:block"></div></div>`);
  G('Gafter', `
    <div class="abs eyebrow" id="af-e" style="${PC ? 'left:150px;top:250px;font-size:20px' : 'left:0;right:0;text-align:center;top:420px;font-size:24px'}">${X.afE}</div>
    <div class="abs h" id="af-h" style="${PC ? 'left:150px;top:300px;font-size:92px;width:760px' : 'left:0;right:0;text-align:center;top:480px;font-size:92px'}">${X.afH}</div>
    <div class="abs" id="af-mail" style="${PC ? 'left:150px;top:560px;width:640px' : 'left:90px;top:760px;width:900px'};background:rgba(255,255,255,.96);color:#2b1734;border-radius:22px;padding:${PC ? '22px 26px' : '28px 32px'};display:flex;gap:20px;align-items:center;box-shadow:0 30px 80px rgba(0,0,0,.45)">

      <div><div style="font-size:${PC ? 15 : 20}px;font-weight:600;letter-spacing:.06em;color:#8a8091;text-transform:uppercase">${X.mail1}</div>
      <div style="font-size:${PC ? 23 : 30}px;font-weight:600;margin-top:4px">${X.mail2}</div>
      <div style="font-size:${PC ? 17 : 23}px;color:#6f6477;margin-top:4px">${X.mail3}</div></div></div>
    <div class="card" id="af-cert" style="${PC ? 'left:1020px;top:170px;width:620px' : 'left:190px;top:1020px;width:700px'};background:transparent;box-shadow:none;border-radius:0;overflow:visible"><img src="order_cert${SFX}.png" style="width:100%;display:block;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))"></div>
    <div class="card" id="af-check" style="${PC ? 'left:880px;top:250px;width:880px' : 'left:90px;top:820px;width:900px'}"><img src="check_page${SFX}.jpg" style="width:100%;display:block"></div>
    <div class="abs" id="af-cl" style="${PC ? 'left:880px;top:740px;font-size:24px' : 'left:0;right:0;text-align:center;top:1430px;font-size:30px'};color:rgba(255,255,255,.85)">${X.check}</div>`);
  const t0 = PC ? 250 : 520, dy = PC ? 170 : 290;
  G('Gterms', `

    ${TERMS.map(([id, ic, a, b], k) => `<div class="term" id="tm-${id}" style="top:${t0 + (k % 4) * dy}px"><div class="ic">${ICON[ic]}</div><div class="tx">${a}${b ? `<small>${b}</small>` : ''}</div></div>`).join('')}`);
  G('Goutro', `
    <img class="logo" id="ou-logo" src="../a/logo-white.png" style="width:${PC ? 760 : 760}px;left:${PC ? 580 : 160}px;top:${PC ? 190 : 520}px">
    <div class="abs h" id="ou-h" style="left:0;right:0;text-align:center;top:${PC ? 470 : 820}px;font-size:${X.ouF || (PC ? 84 : 88)}px">${X.ouH}</div>
    <div class="abs" id="ou-u" style="left:0;right:0;text-align:center;top:${PC ? 640 : 1100}px"><span class="pill" style="font-size:${PC ? 26 : 34}px;padding:${PC ? '22px 54px' : '28px 64px'}">imbir.kz</span></div>
    <div class="abs" id="ou-p" style="left:0;right:0;text-align:center;top:${PC ? 790 : 1290}px;font-size:${PC ? 28 : 36}px;color:rgba(255,255,255,.85);line-height:1.6">+7 708 111 8098<br><span style="font-size:${PC ? 22 : 28}px;color:rgba(255,255,255,.6)">${X.ouP}</span></div>`);
}

const imgCache = new Map();
function setImg(el, src) { if (el.getAttribute('src') === src) return Promise.resolve(); el.setAttribute('src', src); return el.decode().catch(() => {}); }

function renderScreen(F, step) {
  $('inner').style.width = VW + 'px'; $('inner').style.height = VH + 'px';
  let [z, cx, cy] = F.z; const s = S0 * z;
  const sw = PC ? 1920 : 682, sh = PC ? 1024 : 1476;
  const tx = sw / 2 - cx * s, ty = sh / 2 - cy * s;
  $('inner').style.transform = `translate(${tx.toFixed(3)}px,${ty.toFixed(3)}px) scale(${s.toFixed(5)})`;
  const cur = $('cursor');
  if (PC && F.p) { cur.style.display = 'block'; const press = F.clicks.some(c => c[2] < .12); cur.style.transform = `translate(${(F.p[0] - 3 / s).toFixed(2)}px,${(F.p[1] - 2 / s).toFixed(2)}px) scale(${((press ? .88 : 1) / s * 1.15).toFixed(4)})`; }
  else cur.style.display = 'none';
  let fx = '';
  for (const [x, y, age] of F.clicks) { const k = cl(age / .6); const r = (PC ? 10 : 18) + k * (PC ? 34 : 46); fx += `<div class="ripple" style="left:${x - r / s}px;top:${y - r / s}px;width:${2 * r / s}px;height:${2 * r / s}px;opacity:${(1 - k).toFixed(3)};border-width:${3 / s}px"></div>`;
    if (!PC && age < .4) fx += `<div class="finger" style="left:${x}px;top:${y}px;transform:scale(${(1 / s).toFixed(3)});opacity:${(1 - age / .4).toFixed(2)}"></div>`; }
  for (const [x, y] of (F.touch || [])) fx += `<div class="finger" style="left:${x}px;top:${y}px;transform:scale(${(1 / s).toFixed(3)})"></div>`;
  for (const [x, y, w, h, age] of F.rings) { const pulse = .5 + .5 * Math.sin(age * 5); const o = cl(age / .35) * (1 - cl((age - 2.2) / .4)); const pad = 8 / s;
    fx += `<div class="ring" style="left:${x - pad}px;top:${y - pad}px;width:${w + 2 * pad}px;height:${h + 2 * pad}px;border-width:${(3 + pulse * 1.5) / s}px;border-radius:${14 / s}px;opacity:${o.toFixed(2)}"></div>`; }
  $('fx').innerHTML = fx;
  $('urltx').innerHTML = '<b>imbir.kz</b>' + (F.url || 'imbir.kz/' + LANG).slice(8);
  const bd = $('badge'); if (step) { bd.style.display = 'flex'; $('bn').textContent = step; $('bt').textContent = X.badge(step, STEPS[step]); } else bd.style.display = 'none';
  const j2 = F.bimg ? setImg($('shot2'), F.bimg) : Promise.resolve(); $('shot2').style.opacity = F.bimg ? F.ba : 0;
  return Promise.all([setImg($('shot'), F.img), j2]);
}

function sceneStart(sid) { const l = PLAN.lines.find(x => x.sid === sid); return l ? l.start : 0; }
function lineV(id) { const l = LN[id]; return l ? l.voice : 1e9; }
function renderGraphic(sid, t) {
  $('G' + sid).style.display = 'block';
  const s0 = sceneStart(sid);
  if (sid === 'intro') {
    rv($('in-logo'), t, s0 + .2, {dy: 20, blur: 14, d: 1}); rv($('in-e'), t, s0 + .6); rv($('in-h'), t, s0 + .8, {dy: 40, d: 1});
    rv($('in-c'), t, s0 + 1.4, {dy: 20}); rv($('in-dev'), t, lineV('i2') - .3, {dy: 80, blur: 0, d: 1.1});
    const k = P(t, s0, s0 + 12, E.io); $('in-devc').style.transform = PC ? `rotateY(${L(-18, -8, k).toFixed(2)}deg) rotateX(${L(6, 2, k).toFixed(2)}deg)` : `rotateX(${L(14, 6, k).toFixed(2)}deg)`;
  }
  if (sid === 'after') {
    const c2 = lineV('a2') - .2;
    rv($('af-e'), t, s0 + .1); rv($('af-h'), t, s0 + .3, {dy: 40}); rv($('af-mail'), t, s0 + 1.2, {dy: -40, z: c2});
    rv($('af-cert'), t, s0 + .6, {dy: 60, blur: 0, d: 1.2, z: c2}); $('af-cert').style.transform += ` rotate(${L(3, -2, P(t, s0, s0 + 9, E.io)).toFixed(2)}deg)`;
    rv($('af-check'), t, c2 + .3, {dy: 60, blur: 0, d: 1}); rv($('af-cl'), t, c2 + .8, {dy: 20});
  }
  if (sid === 'terms') {
    rv($('tm-e'), t, s0 + .1); rv($('tm-h'), t, s0 + .3, {dy: 30});
    const page2 = t >= lineV('t5') - .35;
    TERMS.forEach(([id], k) => { const el = $('tm-' + id); const onPage = (k < 4) !== page2; if (!onPage) { el.style.display = 'none'; return; } el.style.display = 'flex';
      const a = lineV(id) - .15; rv(el, t, a, {dx: -40, dy: 0, d: .6});
      const next = TERMS[k + 1] ? lineV(TERMS[k + 1][0]) - .15 : 1e9; const active = t >= a && t < next;
      el.querySelector('.tx').style.color = active ? '#fff' : 'rgba(255,255,255,.62)'; el.querySelector('.ic').style.background = active ? 'rgba(236,201,120,.28)' : 'rgba(236,201,120,.06)';
      el.querySelector('.ic').style.borderColor = active ? '#ecc978' : 'rgba(236,201,120,.45)'; });
  }
  if (sid === 'outro') { rv($('ou-logo'), t, s0 + .2, {dy: 20, d: 1}); rv($('ou-h'), t, s0 + .7, {dy: 30}); rv($('ou-u'), t, s0 + 1.3, {dy: 20}); rv($('ou-p'), t, s0 + 1.7, {dy: 16}); }
}

async function seek(fi) {
  const F = PLAN.frames[Math.min(fi, PLAN.frames.length - 1)]; const t = F.t; const job = [];
  const G = ['intro', 'after', 'terms', 'outro']; G.forEach(g => { $('G' + g).style.display = 'none'; $('G' + g).style.opacity = 1; });
  if (F.kind === 's') {
    $('Lscreen').style.display = 'block'; job.push(renderScreen(F, F.step));
    if (F.xa !== undefined && F.xkind === 'g') { renderGraphic(F.xsid, F.xt); $('G' + F.xsid).style.opacity = (1 - F.xa).toFixed(3); }
  } else {
    if (F.xa !== undefined && F.xkind === 's') { $('Lscreen').style.display = 'block'; job.push(renderScreen(F.x, null)); } else $('Lscreen').style.display = 'none';
    renderGraphic(F.sid, t); if (F.xa !== undefined && F.xkind === 's') $('G' + F.sid).style.opacity = F.xa.toFixed(3);
  }
  $('subtx').textContent = F.cap; $('sub').style.display = F.cap ? 'flex' : 'none'; $('sub').style.opacity = F.ca;
  $('dip').style.opacity = (Math.max(1 - cl(t / .6), cl((t - (PLAN.total - .8)) / .8)) * .95).toFixed(3);
  await Promise.all(job);
}
window.seek = seek;
window.ready = (async () => {
  PLAN = await (await fetch(Q.get('plan') || (LANG === 'ru' ? `plan2_${DEV}.json` : `plan3_${LANG}_${DEV}.json`))).json();
  PLAN.lines.forEach(l => LN[l.id] = l); VW = PLAN.vw; VH = PLAN.vh; S0 = PC ? 1920 / VW : 682 / VW;
  buildGraphics();
  const first = PLAN.frames.find(f => f.kind === 's'); $('in-shot').src = first.img;
  await Promise.all(['400', '500', '600'].flatMap(w => [`${w} 40px "Cormorant Garamond"`, `italic ${w} 40px "Cormorant Garamond"`, `${w} 20px Montserrat`]).map(f => document.fonts.load(f, 'Таиланд abc ₸ әғқңөұүһі')));
  await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  return PLAN.frames.length;
})();
</script>
