  GB.card.position.set(0, L(y0, 60, rise) + Math.sin((t - to) * 1.3) * 12 * rise, L(0, 170, rise));
  const turn = P(rise, .42, 1, E.out);
  GB.card.rotation.set(L(-.12, 0, turn) + Math.sin(t * 1.1) * .05 * rise, L(-Math.PI * 2, 0, turn) + Math.sin(t * .8) * .16 * rise, Math.sin(t * .7) * .03);
  GB.card.scale.setScalar(sc0);
  GB.card.visible = t > to + .3;
  const pull = P(t, to + .3, to + 2.6, E.io);
  const orbit = Math.sin(lt * .35) * 160;
  camera.position.set(L(orbit, 0, pull), L(160, 260, pull), L(D0 * .8, D0 * 1.0, pull));
  camera.lookAt(0, L(-560, 0, pull), 0);
  GB.key.target.position.set(0, -500, 0);
  driftBokeh(GB.bokeh, t, 40);
  renderer.render(GB.scene, camera);
  const zA = to + .3;
  letters(GB['g-a1'], t, GB.t0 + .5, {stag: .025, z: zA}); letters(GB['g-a2'], t, GB.t0 + 1.0, {stag: .06, d: .8, z: zA});
  rv($('g-b0'), t, to + 1.8, 999, {dy: 14});
  letters(GB['g-b1'], t, to + 2.0, {stag: .03}); letters(GB['g-b2'], t, to + 2.35, {stag: .05, d: .8});
  rv($('g-b3'), t, to + 3.3, 999, {dy: 16});
}

// ================= SCENE 4: finale (21.75 - 30) =================
const S6 = {scene: new THREE.Scene(), t0: 21.75};
function petalTex() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 192; const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 120, 5, 64, 100, 100); g.addColorStop(0, '#fff0f2'); g.addColorStop(.45, '#f3b7c4'); g.addColorStop(1, '#d9788f');
  x.fillStyle = g; x.beginPath(); x.moveTo(64, 186); x.bezierCurveTo(-10, 130, 8, 20, 64, 6); x.bezierCurveTo(120, 20, 138, 130, 64, 186); x.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function initS6() {
  S6.scene.background = bgTexture('#2c0c3c', '#12041a', '#050107', .3);
  S6.key = keyLights(S6.scene);
  S6.bokeh = bokehField(380, [-1400, 1400, -2000, 2000, -3000, 800], 77); S6.scene.add(S6.bokeh);
  const n = 40; S6.petals = new THREE.InstancedMesh(new THREE.PlaneGeometry(46, 68), new THREE.MeshStandardMaterial({map: petalTex(), transparent: true, alphaTest: .05, side: THREE.DoubleSide, roughness: .55}), n);
  S6.petals.frustumCulled = false; S6.scene.add(S6.petals); S6.n = n; S6.dummy = new THREE.Object3D();
  S6.ctx = $('ink').getContext('2d'); S6.NW = 540; S6.NH = 960; S6.noise = valueNoise(S6.NW, S6.NH, 5.1);
  S6.mask = Object.assign(document.createElement('canvas'), {width: S6.NW, height: S6.NH}); S6.md = S6.mask.getContext('2d').createImageData(S6.NW, S6.NH);
  S6.edge = Object.assign(document.createElement('canvas'), {width: S6.NW, height: S6.NH}); S6.ed = S6.edge.getContext('2d').createImageData(S6.NW, S6.NH);
  S6.txt = Object.assign(document.createElement('canvas'), {width: W, height: H}); S6.tmp = Object.assign(document.createElement('canvas'), {width: W, height: H});
  S6.draw = c => { c.font = '500 220px "Cormorant Garamond"'; c.letterSpacing = '6px'; const g = c.createLinearGradient(160, 0, 920, 0); g.addColorStop(0, '#a47d2e'); g.addColorStop(.3, '#ecc978'); g.addColorStop(.5, '#fff4d2'); g.addColorStop(.7, '#ecc978'); g.addColorStop(1, '#a47d2e'); c.fillStyle = g; c.fillText('imbir.kz', 540, 1030); c.letterSpacing = '0px'; };
}
function valueNoise(Wn, Hn, seed) {
  const out = new Float32Array(Wn * Hn);
  for (const [cell, amp] of [[34, .5], [15, .27], [7, .15], [3, .08]]) { const gw = Math.ceil(Wn / cell) + 2; const g = new Float32Array(gw * (Math.ceil(Hn / cell) + 2)); for (let i = 0; i < g.length; i++) g[i] = rnd(i * 1.37 + seed + cell * 7.1);
    for (let y = 0; y < Hn; y++) { const fy = y / cell, iy = fy | 0, ty = fy - iy, sy = ty * ty * (3 - 2 * ty); for (let x = 0; x < Wn; x++) { const fx = x / cell, ix = fx | 0, tx = fx - ix, sx = tx * tx * (3 - 2 * tx);
      const a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1]; out[y * Wn + x] += amp * (a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy); } } }
  let mn = 1e9, mx = -1e9; for (const v of out) { mn = Math.min(mn, v); mx = Math.max(mx, v); } for (let i = 0; i < out.length; i++) out[i] = (out[i] - mn) / (mx - mn); return out;
}
function inkPass(k) {
  const th = 1.08 - k * 1.16, n = S6.noise, md = S6.md.data, ed = S6.ed.data;
  for (let i = 0, j = 0; i < n.length; i++, j += 4) { const v = n[i] - th; md[j + 3] = v <= 0 ? 0 : v >= .035 ? 255 : v / .035 * 255;
    const e = v > -.01 && v < .07 ? 1 - Math.abs(v - .025) / .045 : 0; ed[j] = 255; ed[j + 1] = 214; ed[j + 2] = 140; ed[j + 3] = e > 0 ? Math.min(255, e * 255) : 0; }
  S6.mask.getContext('2d').putImageData(S6.md, 0, 0); S6.edge.getContext('2d').putImageData(S6.ed, 0, 0);
}

function renderS6(t) {
  const lt = t - S6.t0;
  const mi = P(lt, .1, 1.4, E.out5); st($('f-logo'), {o: mi, y: (1 - mi) * 30, s: L(.94, 1, mi), b: (1 - mi) * 10});
  const fg = P(t, S6.t0 + 1.3, S6.t0 + 2.4, E.io); $('f-glint').style.opacity = fg > 0 && fg < 1 ? 1 : 0; $('f-glint').style.backgroundPosition = `${L(130, -30, fg).toFixed(1)}% 0`; $('f-glint').style.transform = $('f-logo').style.transform;
  S6.key.position.set(Math.sin(lt * .9) * 1500, 1000, 1400);
  const d = S6.dummy;
  for (let i = 0; i < S6.n; i++) { const sp = 110 + rnd(i + 3) * 120; let y = 1300 + rnd(i + 5) * 2600 - (lt + 1.5) * sp; y = ((y + 1500) % 3000 + 3000) % 3000 - 1500;
    d.position.set(L(-800, 800, rnd(i + 7)) + Math.sin(lt * .7 + i) * 80, y, L(-900, 700, rnd(i + 9)));
    d.rotation.set(lt * (.5 + rnd(i + 11)) + i, lt * (.7 + rnd(i + 13)) + i * 2, lt * .3 + i); d.scale.setScalar((.8 + rnd(i + 15) * .8) * P(lt, 0, 1)); d.updateMatrix(); S6.petals.setMatrixAt(i, d.matrix); }
  S6.petals.instanceMatrix.needsUpdate = true;
  driftBokeh(S6.bokeh, t, 40);
  camera.position.set(0, 0, D0 * L(1.08, 1, P(lt, 0, 8, E.out))); camera.lookAt(0, 0, 0);
  renderer.render(S6.scene, camera);
  const ctx = S6.ctx; ctx.clearRect(0, 0, W, H);
  const k = P(t, S6.t0 + 1.0, S6.t0 + 2.3, E.sine);
  if (k > 0) { const tc = S6.txt.getContext('2d'); tc.clearRect(0, 0, W, H); tc.textAlign = 'center'; tc.textBaseline = 'middle'; S6.draw(tc);
    inkPass(k); const m = S6.tmp.getContext('2d'); m.globalCompositeOperation = 'source-over'; m.clearRect(0, 0, W, H); m.drawImage(S6.txt, 0, 0); m.globalCompositeOperation = 'destination-in'; m.drawImage(S6.mask, 0, 0, W, H); m.globalCompositeOperation = 'source-over'; ctx.drawImage(S6.tmp, 0, 0);
    if (k < 1) { m.clearRect(0, 0, W, H); m.drawImage(S6.edge, 0, 0, W, H); m.globalCompositeOperation = 'destination-in'; m.drawImage(S6.txt, 0, 0); m.globalCompositeOperation = 'source-over'; ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(3px)'; ctx.drawImage(S6.tmp, 0, 0); ctx.filter = 'none'; ctx.drawImage(S6.tmp, 0, 0); ctx.globalCompositeOperation = 'source-over'; } }
  for (const [a, b] of [[25.2, 26.4], [28.2, 29.4]]) { const sh = P(t, a, b, E.io); if (sh > 0 && sh < 1) { ctx.save(); ctx.globalCompositeOperation = 'source-atop'; const x = L(100, 980, sh); const g = ctx.createLinearGradient(x - 120, 0, x + 120, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,250,235,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 900, W, 260); ctx.restore(); } }
  rv($('f-tag'), t, S6.t0 + 2.2, 999, {dy: 18});
  rv($('f-btn'), t, S6.t0 + 2.8, 999, {dy: 24, pre: 'translateX(-50%)', s0: .9});
  rv($('f-ph'), t, S6.t0 + 3.2, 999, {dy: 14});
}

// ================= global =================
const SCN = [[0, 4.5, 1, renderS1], [4.5, 11.25, 2, renderS2], [11.25, 21.75, 3, renderGB], [21.75, 30.01, 4, renderS6]];
const CUTS = [4.5, 11.25, 21.75];
const grainTiles = [];
function initGrain() { for (let k = 0; k < 6; k++) { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rnd(i * .013 + k * 91.7) - .5) * 170; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); grainTiles.push(c); } }

function overlays(t) {
  $('grain').getContext('2d').drawImage(grainTiles[Math.floor(t * FPS) % grainTiles.length], 0, 0);
  let fl = 0;
  for (const c of CUTS) { const d = t - c; if (d > -.25 && d < .6) fl = Math.max(fl, d < 0 ? E.in3((d + .25) / .25) : 1 - E.out(d / .6)); }
  { const d = t - 2.45; if (d > -.1 && d < .9) fl = Math.max(fl, .45 * (d < 0 ? (d + .1) / .1 : 1 - E.out(d / .9))); }
  { const d = t - (GB.tOpen + .05); if (d > -.1 && d < 1.0) fl = Math.max(fl, .75 * (d < 0 ? (d + .1) / .1 : 1 - E.out(d / 1.0))); }
  $('flash').style.opacity = (fl * .85).toFixed(3);
}
async function seek(t) {
  let active = null;
  for (const s of SCN) { const on = t >= s[0] && t < s[1]; $('L' + s[2]).style.display = on ? 'block' : 'none'; if (on) active = s; }
  await active[3](t);
  overlays(t);
}
window.seek = seek;
window.ready = (async () => {
  await Promise.all(['400', '500', '600'].flatMap(w => [`${w} 40px "Cormorant Garamond"`, `italic ${w} 40px "Cormorant Garamond"`, `${w} 20px Montserrat`]).map(f => document.fonts.load(f, 'Таиланд abc ₸')));
  await document.fonts.ready;
  iconImg = await getImg('a/icon-gold.png');
  await initS1(); initS2(); await initGB(); initS6(); initGrain();
  for (const s of [S1, S2, GB, S6]) { camera.position.set(0, 0, D0); camera.lookAt(0, 0, 0); renderer.compile(s.scene, camera); }
  return document.fonts.check('500 40px "Cormorant Garamond"', 'Таиланд');
})();
