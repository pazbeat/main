<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Imbir reels</title>
<link href="fonts/fonts.css" rel="stylesheet">

<style>
:root{--gold:#b69244;--gold-hi:#ecc978;--serif:"Cormorant Garamond",serif;--sans:"Montserrat",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0c0312;font-family:var(--sans);color:#fff}
canvas.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
.layer{position:absolute;inset:0;display:none}
.abs{position:absolute}
.eyebrow{font-weight:500;font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-hi)}
.center{left:0;right:0;text-align:center}
.serif{font-family:var(--serif)}
.word{position:absolute;font-family:var(--serif);line-height:.95;white-space:nowrap}
.word span{display:inline-block}
.foil{background:linear-gradient(100deg,#9c7429 0%,#e9c77a 28%,#fff4d2 45%,#e9c77a 60%,#a47d2e 80%,#e9c77a 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.shadow{text-shadow:0 8px 40px rgba(0,0,0,.65)}
.pill{font-weight:600;font-size:24px;letter-spacing:.2em;text-transform:uppercase;padding:28px 54px;border-radius:999px;background:linear-gradient(135deg,#e4c47c,#b69244);color:#2b0b3d;white-space:nowrap;box-shadow:0 20px 60px rgba(182,146,68,.35)}
.chip{display:inline-block;font-size:22px;letter-spacing:.12em;padding:16px 28px;border-radius:999px;border:1px solid rgba(236,201,120,.55);color:#fff;background:rgba(28,7,38,.45);margin:8px 6px}
#flash{position:absolute;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,#fff6dc 0%,#ecc978 35%,rgba(236,201,120,0) 75%);mix-blend-mode:screen;opacity:0}
#leak{position:absolute;inset:0;z-index:39;pointer-events:none;mix-blend-mode:screen;opacity:0}
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:41;pointer-events:none;mix-blend-mode:overlay;opacity:.14}
#vig{position:absolute;inset:0;z-index:42;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
.city{position:absolute;left:0;right:0;text-align:center;font-family:var(--serif);font-size:62px;font-weight:500;transform-origin:50% 50% -40px}
.city small{font-family:var(--sans);font-size:18px;letter-spacing:.2em;color:var(--gold-hi);margin-left:18px;vertical-align:middle;text-transform:uppercase}
</style>
</head>

  <div id="flash"></div>

    const tc = S6.txt.getContext('2d'); tc.clearRect(0, 0, W, H); tc.textAlign = 'center'; tc.textBaseline = 'middle'; Ly.draw(tc);
    inkPass(k);
    const m = S6.tmp.getContext('2d'); m.globalCompositeOperation = 'source-over'; m.clearRect(0, 0, W, H); m.drawImage(S6.txt, 0, 0); m.globalCompositeOperation = 'destination-in'; m.drawImage(S6.mask, 0, 0, W, H); m.globalCompositeOperation = 'source-over';
    ctx.drawImage(S6.tmp, 0, 0);
    if (k < 1) { m.clearRect(0, 0, W, H); m.drawImage(S6.edge, 0, 0, W, H); m.globalCompositeOperation = 'destination-in'; m.drawImage(S6.txt, 0, 0); m.globalCompositeOperation = 'source-over';
      ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(3px)'; ctx.drawImage(S6.tmp, 0, 0); ctx.filter = 'none'; ctx.drawImage(S6.tmp, 0, 0); ctx.globalCompositeOperation = 'source-over'; }
  }
  const sh = P(t, 23.9, 25, E.io);
  if (sh > 0 && sh < 1) { ctx.save(); ctx.globalCompositeOperation = 'source-atop'; const x = L(100, 980, sh); const g = ctx.createLinearGradient(x - 120, 0, x + 120, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,250,235,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 920, W, 280); ctx.restore(); }
  rv($('f-btn'), t, 23.4, 999, {dy: 24, pre: 'translateX(-50%)', s0: .9});
  rv($('f-ph'), t, 23.7, 999, {dy: 14});
}

// ================= global =================
const SCN = [[0, 3.75, 1, renderS1], [3.75, 7.5, 2, renderS2], [7.5, 13.75, 3, renderS3], [13.75, 17.5, 4, renderS4], [17.5, 20, 5, renderS5], [20, 25.01, 6, renderS6]];
const CUTS = [3.75, 7.5, 13.75, 17.5], BIG = [1.95, 20];
const grainTiles = [];
function initGrain() { for (let k = 0; k < 6; k++) { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d'); const d = x.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rnd(i * .013 + k * 91.7) - .5) * 170; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); grainTiles.push(c); } }
function overlays(t) {
  $('grain').getContext('2d').drawImage(grainTiles[Math.floor(t * FPS) % grainTiles.length], 0, 0);
  let fl = 0;
  for (const c of CUTS) { const d = t - c; if (d > -.06 && d < .4) fl = Math.max(fl, d < 0 ? (d + .06) / .06 : 1 - E.out(d / .4)); }
  for (const c of BIG) { const d = t - c; if (d > -.1 && d < .9) fl = Math.max(fl, d < 0 ? (d + .1) / .1 : 1 - E.out(d / .9)); }
  for (let i = 1; i < 5; i++) { const d = t - (7.5 + i * 1.25); if (d > -.03 && d < .3) fl = Math.max(fl, .35 * (d < 0 ? 1 : 1 - d / .3)); }
  $('flash').style.opacity = (fl * .85).toFixed(3);
  const lk = Math.max(P(t, 7.5, 8.2) * (1 - P(t, 13.3, 13.75)), P(t, 13.75, 14.4) * (1 - P(t, 17, 17.5)));
  const lx = 50 + Math.sin(t * .8) * 45, ly = 35 + Math.cos(t * .55) * 30;
  $('leak').style.background = `radial-gradient(700px 900px at ${lx}% ${ly}%, rgba(255,150,60,.32), rgba(255,120,40,0) 70%), radial-gradient(600px 800px at ${100 - lx}% ${100 - ly}%, rgba(170,70,255,.2), rgba(0,0,0,0) 70%)`;
  $('leak').style.opacity = (lk * (.55 + .45 * Math.sin(t * 2.1))).toFixed(3);
}
async function seek(t) {
  let active = null;
  for (const s of SCN) { const on = t >= s[0] && t < s[1]; $('L' + s[2]).style.display = on ? 'block' : 'none'; if (on) active = s; }
  const is2d = active[2] === 2; $('c2d').style.display = is2d ? 'block' : 'none'; $('gl').style.display = is2d ? 'none' : 'block';
  if (active[2] !== 3) $('gl').style.filter = 'none';
  await active[3](t);
  overlays(t);
}
window.seek = seek;
window.ready = (async () => {
  await Promise.all(['400', '500', '600'].flatMap(w => [`${w} 40px "Cormorant Garamond"`, `italic ${w} 40px "Cormorant Garamond"`, `${w} 20px Montserrat`]).map(f => document.fonts.load(f, 'Таиланд abc ₸')));
  await document.fonts.ready;
  iconImg = await getImg('a/icon-gold.png');
  await initS1(); initS2(); initS3(); await initS4(); initS5(); initS6(); initGrain();
  // warm up shaders
  for (const s of [S1, S3, S4, S5, S6]) { camera.position.set(0, 0, D0); camera.lookAt(0, 0, 0); renderer.compile(s.scene, camera); }
  return document.fonts.check('500 40px "Cormorant Garamond"', 'Таиланд');
})();
</script>
